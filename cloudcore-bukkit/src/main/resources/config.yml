# Cloud Core 插件配置
# 文档：docs/04-server.md、docs/07-security.md

# 为方便排查容器时序，打开后会为每次 InventoryOpenEvent 发一个 PING
inventory-probe: false

pages:
  # 页面文件变化后自动重载（400ms 合并窗口），并给正在查看的玩家推送新文档
  watch: true

apply-on-join:
  # 进服自动下发。留空（默认）时，pages/ 下所有「常驻类」页面自动生效：
  #   surface: hud              → 常驻 HUD
  #   surface: player_inventory → 背包皮肤
  #   surface: tooltip          → Tooltip 主题
  #   surface: boss_bar         → Boss 血条皮肤
  # 界面类（custom_screen）和容器类（container）不在此列，它们由命令或打开容器触发。
  # 单个页面不想进服生效，在它的 surface_options 里写 on_join: false。
  # pages 非空时只下发列出的页面（按 pages/ 下的文件名，不含 .yml）。
  pages: []

placeholders:
  # 安装了 PlaceholderAPI 时，在发送/刷新页面时解析可见文本里的 %占位符%。
  # 关闭后 %token% 原样显示。只解析 text/placeholder 与标题，不碰颜色、尺寸和贴图引用。
  enabled: true

state:
  # 会话状态按玩家持久化到 plugins/CloudCore/state/<uuid>.json（异步写、原子替换），
  # 玩家重进后页面沿用上次的值。关闭后状态只存在于本次在线期间。
  persist: true

actions:
  commands:
    # 关闭时，页面里的 command 动作一律拒绝（返回 EVENT_RESULT=REJECTED）
    enabled: false
    # 只允许这些命令（不含前导斜杠），按第一个词精确匹配、忽略大小写
    allowlist: []
