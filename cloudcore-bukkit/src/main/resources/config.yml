# Cloud Core 插件配置
# 文档：docs/04-server.md、docs/07-security.md

# 为方便排查容器时序，打开后会为每次 InventoryOpenEvent 发一个 PING
inventory-probe: false

pages:
  # 页面文件变化后自动重载（400ms 合并窗口），并给正在查看的玩家推送新文档
  watch: true

apply-on-join:
  # 进服自动下发。留空（默认）时，pages/ 下所有「常驻类」页面自动生效：
  #   surface: hud              → 常驻 HUD
  #   surface: player_inventory → 背包皮肤
  #   surface: tooltip          → Tooltip 主题
  #   surface: boss_bar         → Boss 血条皮肤
  # 界面类（custom_screen）和容器类（container）不在此列，它们由命令或打开容器触发。
  # 单个页面不想进服生效，在它的 surface_options 里写 on_join: false。
  # pages 非空时只下发列出的页面（按 pages/ 下的文件名，不含 .yml）。
  pages: []

placeholders:
  # 安装了 PlaceholderAPI 时，在发送/刷新页面时解析可见文本里的 %占位符%。
  # 关闭后 %token% 原样显示。只解析 text/placeholder 与标题，不碰颜色、尺寸和贴图引用。
  enabled: true
  # 周期刷新的软预算：超出后剩余页面顺延到下一个间隔，不阻塞服务器 tick。
  player-budget-ms: 2
  global-budget-ms: 10
  # 异步刷新（页面写 placeholders.async: true）只允许这些命名空间在后台线程展开。
  # 未列出的命名空间会改在主线程展开，避免不线程安全的扩展破坏服务器状态。
  # 条目是 %token% 里下划线前的部分，例如 %player_name% 属于 player。
  async-namespaces: []

textures:
  url:
    # client: 客户端直连图床（默认，不占服务端带宽）
    # proxy:  服务端按 allowlist 下载、解码后用 TEXTURE_PUT 下发
    # auto:   先发 TEXTURE_REF；客户端直连失败或 remoteImages=false 时再请求服务端代理
    mode: client
    # 仅 https；条目是 URL 前缀，建议以 / 结尾，例如 "https://cdn.example.com/ui/"
    allowlist: []
    max-bytes: 8388608
    timeout-seconds: 10
    # 0 表示按内容哈希永久缓存；否则缓存文件超过该秒数后重新拉取
    ttl-seconds: 3600
    # 代理模式磁盘缓存上限（MiB）；按最旧文件淘汰
    cache-mb: 256

state:
  # 会话状态按玩家持久化，玩家重进后页面沿用上次的值。
  # 关闭后状态只存在于本次在线期间。
  persist: true
  # file   = plugins/CloudCore/state/<uuid>.json（默认，零依赖）
  # sqlite = 单文件数据库，驱动已随插件打包
  # mysql  = 需要服务端自己提供 JDBC 驱动（例如把 Connector/J 放进 plugins/）
  backend: file
  sqlite:
    file: state.db
  mysql:
    driver: com.mysql.cj.jdbc.Driver
    url: ""
    username: ""
    password: ""

actions:
  commands:
    # 关闭时，页面里的 command 动作一律拒绝（返回 EVENT_RESULT=REJECTED）
    enabled: false
    # 只允许这些命令（不含前导斜杠），按第一个词精确匹配、忽略大小写
    allowlist: []
