name: CloudCore
version: '${version}'
main: com.cloudcore.bukkit.CloudCorePlugin
api-version: '1.21'
authors: [kawasaki222]
description: Server-authoritative custom UI framework for Minecraft 1.21.11
softdepend: [PlaceholderAPI]
commands:
  cloudcore:
    description: Cloud Core administration
    usage: /cloudcore <ping>
    permission: cloudcore.admin
permissions:
  cloudcore.admin:
    description: Allows Cloud Core administrative commands
    default: op
