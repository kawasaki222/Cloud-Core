# 动作示例：open_page / sound / close_ui
# /cloudcore page actions_demo <玩家>
schema: 1
id: actions_demo
surface: custom_screen
title: "Actions Demo"
theme: dark
size: [220, 150]
state: {}
includes: []
elements:
  - type: panel
    id: root
    x: 0
    y: 0
    width: fill
    height: fill
    style:
      background: "#CC202830"
  - type: label
    id: heading
    x: 12
    y: 10
    text: "动作：open_page / sound / close_ui"
    color: "#FFFFFFFF"

  - type: button
    id: open_example
    x: 12
    y: 32
    width: 196
    height: 18
    text: "打开示例页（open_page）"
    style:
      background: "#FF3C6E9F"
      hover:
        background: "#FF5C8EBF"
    on:
      click:
        - action: open_page
          page: example

  - type: button
    id: play_sound
    x: 12
    y: 56
    width: 196
    height: 18
    text: "播放按钮音效（sound）"
    style:
      background: "#FF3C9F6E"
      hover:
        background: "#FF5CBF8E"
    on:
      click:
        - action: sound
          sound: "minecraft:ui.button.click"
          volume: 1.0
          pitch: 1.2
        - action: message
          value: "已播放音效"

  - type: button
    id: close
    x: 12
    y: 80
    width: 196
    height: 18
    text: "关闭（close_ui）"
    style:
      background: "#FF9F3C6E"
      hover:
        background: "#FFD05C8E"
    on:
      click:
        - action: close_ui

  # enabled: false → 变暗、失去悬停态、点击不触发（服务端收不到事件）
  - type: button
    id: sold_out
    x: 12
    y: 102
    width: 196
    height: 16
    text: "已售罄（disabled，点不动）"
    enabled: false
    style:
      background: "#FF6E3C3C"
      hover:
        background: "#FFB05C5C"
    on:
      click:
        - action: message
          value: "不应该收到这条消息"

  # 右键优先走 right_click，没有该事件时回退到 click
  - type: button
    id: right_click_demo
    x: 12
    y: 124
    width: 196
    height: 16
    text: "右键试试（right_click）"
    style:
      background: "#FF3C6F9F"
      hover:
        background: "#FF5C8FBF"
    on:
      right_click:
        - action: message
          value: "右键生效"
      click:
        - action: message
          value: "左键生效"
