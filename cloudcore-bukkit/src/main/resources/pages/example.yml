# Cloud Core 示例页面：复制到 plugins/CloudCore/pages/ 后可用
# /cloudcore page example <玩家>
schema: 1
id: example
surface: custom_screen
title: "Cloud Core Example"
theme: dark
size: [320, 180]
state:
  title: "示例页面"
  clicks: 0
  entries:
    - { id: sword, name: "铁剑", price: 120 }
    - { id: shield, name: "盾牌", price: 80 }
    - { id: potion, name: "药水", price: 35 }
includes: []
elements:
  - type: panel
    id: root
    x: 0
    y: 0
    width: fill
    height: fill
    style:
      background: "#CC202830"
  - type: label
    id: heading
    x: 16
    y: 12
    text: "${state.title}"
    color: "#FFFFFFFF"
  - type: label
    id: hint
    x: 16
    y: 28
    text: "repeat + template + nine-slice"
    color: "#FF9AD0FF"
  - type: image
    id: frame
    x: 16
    y: 44
    width: 200
    height: 40
    texture: "pack:minecraft:block/diamond_block"
    nine_slice: [4, 4, 4, 4]
  - type: repeat
    id: rows
    source: "${state.entries}"
    as: entry
    index: i
    children:
      - type: button
        id: row
        x: 16
        y: 96
        width: 200
        height: 18
        text: "${i}. ${entry.name} - ${entry.price}"
        style:
          background: "#FF3C6E9F"
        on:
          click:
            - action: message
              value: "选择了 ${entry.name}（${entry.price} 金）"
  - type: image
    id: remote_image
    x: 240
    y: 120
    width: 56
    height: 56
    texture: "url:https://httpbin.org/image/png"
  - type: label
    id: clicks_label
    x: 232
    y: 44
    text: "点击次数：${state.clicks}"
    color: "#FFE8E8E8"
  - type: button
    id: add_click
    x: 232
    y: 58
    width: 72
    height: 20
    text: "+1"
    style:
      background: "#FF4A9F6E"
    on:
      click:
        - action: set_state
          key: clicks
          value: 1
  - type: button
    id: say_button
    x: 232
    y: 84
    width: 72
    height: 20
    text: "喊话"
    style:
      background: "#FF3C9F9F"
    on:
      click:
        - action: command
          command: "say 来自 Cloud Core 页面"
  - type: button
    id: close_button
    x: 232
    y: 96
    width: 72
    height: 20
    text: "关闭"
    style:
      background: "#FF9F3C6E"
    on:
      click:
        - action: close_ui
