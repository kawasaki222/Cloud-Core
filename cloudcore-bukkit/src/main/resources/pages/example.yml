# Cloud Core 示例页面：复制到 plugins/CloudCore/pages/ 后可用
# /cloudcore page example <玩家>
schema: 1
id: example
surface: custom_screen
title: "Cloud Core Example"
theme: dark
size: [320, 200]
state:
  title: "示例页面"
  clicks: 0
  notify: false
  balance: 100
  entries:
    - { id: sword, name: "铁剑", price: 120 }
    - { id: shield, name: "盾牌", price: 80 }
    - { id: potion, name: "药水", price: 35 }
includes: []
elements:
  - type: panel
    id: root
    x: 0
    y: 0
    width: fill
    height: fill
    style:
      background: "#CC202830"
  - type: label
    id: heading
    x: 16
    y: 12
    text: "${state.title}"
    color: "#FFFFFFFF"
  - type: label
    id: hint
    x: 16
    y: 28
    text: "repeat + template + nine-slice"
    color: "#FF9AD0FF"
  - type: image
    id: frame
    x: 16
    y: 44
    width: 200
    height: 40
    texture: "pack:minecraft:block/diamond_block"
    nine_slice: [4, 4, 4, 4]
  - type: repeat
    id: rows
    source: "${state.entries}"
    as: entry
    index: i
    children:
      - type: button
        id: row
        x: 16
        y: 96
        width: 200
        height: 18
        text: "${i}. ${entry.name} - ${entry.price}"
        style:
          background: "#FF3C6E9F"
        on:
          click:
            - action: message
              value: "选择了 ${entry.name}（${entry.price} 金）"
  - type: checkbox
    id: notify_toggle
    x: 16
    y: 186
    width: 120
    height: 12
    text: "接收通知"
    checked: "${state.notify}"
    on:
      change:
        - action: set_state
          key: notify
          value: "${checked}"
  - type: text_field
    id: name_input
    x: 16
    y: 162
    width: 140
    height: 14
    placeholder: "输入名字…"
    max_length: 16
    on:
      submit:
        - action: message
          value: "输入：${value}"
  - type: image
    id: remote_image
    x: 160
    y: 120
    width: 56
    height: 56
    texture: "url:https://httpbin.org/image/png"
  - type: label
    id: clicks_label
    x: 232
    y: 44
    text: "点击次数：${state.clicks}"
    color: "#FFE8E8E8"
  - type: button
    id: add_click
    x: 232
    y: 58
    width: 72
    height: 20
    text: "+1"
    style:
      background: "#FF4A9F6E"
    on:
      click:
        - action: set_state
          key: clicks
          value: "${state.clicks + 1}"
  - type: label
    id: balance_label
    x: 232
    y: 140
    text: "余额：${state.balance}"
    color: "#FFFFD479"
  - type: button
    id: buy_button
    x: 232
    y: 152
    width: 72
    height: 20
    text: "购买(100)"
    style:
      background: "#FF6E3C9F"
    on:
      click:
        - action: if
          condition: "${state.balance >= 100}"
          then:
            - action: set_state
              key: balance
              value: "${state.balance - 100}"
            - action: message
              value: "购买成功，余额 ${state.balance - 100}"
          else:
            - action: message
              value: "余额不足"
  - type: button
    id: say_button
    x: 232
    y: 84
    width: 72
    height: 20
    text: "喊话"
    style:
      background: "#FF3C9F9F"
    on:
      click:
        - action: command
          command: "say 来自 Cloud Core 页面"
  - type: button
    id: delayed_button
    x: 232
    y: 176
    width: 72
    height: 20
    text: "延迟2秒"
    style:
      background: "#FF3C9F6E"
    on:
      click:
        - action: delay
          ticks: 40
          then:
            - action: message
              value: "两秒后到达"
  - type: button
    id: close_button
    x: 232
    y: 96
    width: 72
    height: 20
    text: "关闭"
    style:
      background: "#FF9F3C6E"
      hover:
        background: "#FFD05C8E"
    on:
      click:
        - action: close_ui
